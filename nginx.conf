server {
    listen 80;
    # Слушаем и IPv6: healthcheck ходит на localhost, который в контейнере
    # резолвится в [::1] — без этой строки wget получает Connection refused
    # и контейнер стабильно уходит в unhealthy (#3024 в репозитории бота).
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Кабинет — закрытое приложение за логином, в поиске его быть не должно:
    # бренд ищут на лендинге zanityvpn.com. robots.txt при этом обход
    # разрешает (public/robots.txt), иначе поисковик не увидит noindex.
    # add_header наследуется в location, только если там нет своих add_header,
    # поэтому в location = /index.html заголовок повторён.
    add_header X-Robots-Tag "noindex, nofollow" always;

    # SPA fallback
    location / {
        try_files $uri /index.html;
    }

    # index.html правится на старте контейнера (docker/40-cabinet-brand.sh) и
    # содержит хэши ассетов: закешированная копия показывала бы старый бренд и
    # тянула бы удалённые бандлы. Сами ассеты кешируются на год ниже.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # API проксировать, если нужно
    location /api/ {
        try_files $uri /index.html;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Optional: кэширование статических файлов
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public";
    }
}
